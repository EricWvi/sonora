# Development configuration used by `task run:server` (needs -tags dev).
# Signs in with the fixed accounts from internal/devmode and skips the
# admin setup token and OIDC. A release binary refuses to start with it.
listen: "127.0.0.1:14560"
data_dir: "./.data/data"
media_dir: "./.data/media"
dev: true
# Started by `task run:server`, which removes it again on exit.
netease:
  api_url: "http://127.0.0.1:14562"
  # The development listener is in this group, see devmode.Groups.
  import_group: "sonora-import"
