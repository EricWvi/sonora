# HTTP listen address
listen: ":14560"
# SQLite database and cover images
data_dir: "/data"
# Volume for uploaded audio. Only Sonora writes here; music enters the
# library through the admin console, files placed by hand are ignored.
media_dir: "/media"

# Origin browsers use to reach Sonora. Requests that change state must
# come from it. The admin console lives at <public_url>/admin/.
public_url: "https://music.example.com"

# Authelia signs listeners in to the player. Register the client with the
# redirect URI <public_url>/auth/callback, PKCE (S256) and the scopes
# openid, profile and email. Prefer passing the secret through the
# SONORA_OIDC_CLIENT_SECRET environment variable.
oidc:
  issuer: "https://auth.example.com"
  client_id: "sonora"
  client_secret: ""

# NetEase Cloud Music API service. Leave it out to turn NetEase off. Keep the
# service on an internal network: it has no authentication of its own.
netease:
  api_url: "http://netease-api:3000"
  # The Authelia group whose members may import songs. Allow the client the
  # groups scope first: see docs/deployment.md.
  # import_group: "sonora-import"
