version: "3"

vars:
  # Keep in step with the version in docs/deployment.md.
  NETEASE_API_IMAGE: moefurina/ncm-api:4.41.1
  NETEASE_API_CONTAINER: sonora-netease-api-dev

tasks:
  default:
    cmds:
      - task: list

  list:
    desc: List all tasks in the current project
    cmds:
      - task --list

  # Install dependencies
  install:
    desc: Install all project dependencies
    cmds:
      - task: install:web
      - task: install:go

  install:web:
    desc: Install locked frontend and admin dependencies (Node 22.12+, pnpm 10.28.1)
    cmds:
      - pnpm install --frozen-lockfile

  install:go:
    desc: Download Go module dependencies
    dir: backend
    cmds:
      - go mod download

  # Clean and build
  build:
    desc: Build the release binary with both web apps embedded (release/sonora)
    cmds:
      - ./scripts/build.sh

  build:frontend:
    desc: Typecheck and build frontend/dist
    cmds:
      - pnpm build

  build:admin:
    desc: Typecheck and build admin/dist
    cmds:
      - pnpm build:admin

  build:go:
    desc: Compile all Go packages
    dir: backend
    cmds:
      - go build ./...

  clean:
    desc: Remove web builds, embedded copies and release binaries
    cmds:
      - rm -rf frontend/dist admin/dist release
      - find backend/web -mindepth 2 ! -name .gitkeep -delete

  # Format and validate
  format:
    desc: Format frontend, admin and Go sources
    cmds:
      - task: format:frontend
      - task: format:admin
      - task: format:go

  format:frontend:
    desc: Format frontend files with Prettier
    cmds:
      - pnpm format

  format:admin:
    desc: Format admin files with Prettier
    cmds:
      - pnpm format:admin

  format:go:
    desc: Format Go sources with gofmt
    dir: backend
    cmds:
      - gofmt -w .

  lint:
    desc: Run all formatting, lint and type checks
    cmds:
      - task: lint:frontend
      - task: lint:admin
      - task: lint:go

  lint:frontend:
    desc: Check frontend formatting, ESLint (with dependency boundaries) and TypeScript
    cmds:
      - pnpm format:check
      - pnpm lint
      - pnpm typecheck

  lint:admin:
    desc: Check admin formatting, ESLint and TypeScript
    cmds:
      - pnpm format:check:admin
      - pnpm lint:admin
      - pnpm typecheck:admin

  lint:go:
    desc: Check gofmt and run go vet for release, dev and authelia-tagged builds
    dir: backend
    silent: true
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt needed (run task format:go):"
          echo "$unformatted"
          exit 1
        fi
      - go vet ./...
      - go vet -tags dev ./...
      - go vet -tags authelia ./internal/auth

  test:
    desc: Run all checks, Go and player unit tests, and web builds
    cmds:
      - task: lint
      - task: test:go
      - task: test:frontend
      - task: build:frontend
      - task: build:admin

  test:go:
    desc: Run Go unit and HTTP tests for release and dev builds
    dir: backend
    cmds:
      - go test ./...
      - go test -tags dev ./internal/config

  test:frontend:
    desc: Run the player's unit tests (playback controller and queue, vitest)
    dir: frontend
    cmds:
      - pnpm test {{.CLI_ARGS}}

  test:visual:
    desc: Compare the player with the SPlayer reference screenshots (this machine only, see docs/phase/phase-3-player-shell.md 3.6)
    summary: |
      Starts a throwaway Vite server on 127.0.0.1:14571, captures Sonora's
      player with ?fixture=baseline in every viewport and state of the
      reference, compares pixel by pixel and judges the differences against
      the ones Eric accepted. Fails on any other difference.

      Runs only on this machine. It needs:
        - the reference screenshots in .local/baseline/splayer/2026-10-25-sonora/,
          captured from the local SPlayer instance with
          scripts/baseline/splayer-player.mjs --sonora (run from ../palace);
        - the baseline fixture in .local/fixtures/baseline/
          (node scripts/fixtures/baseline.mjs);
        - Playwright installed in ../palace (or PLAYWRIGHT_TEST).
      It never touches the SPlayer instance or its credentials. Output goes to
      .local/visual/test-visual/. Pass script options after --, for example
      task test:visual -- --viewport 1440x1000 --only '^bar-'
    cmds:
      - node scripts/visual/compare.mjs {{.CLI_ARGS}}

  test:contract:
    desc: Run the Authelia contract test using locally prepared images (never pulls)
    dir: backend
    cmds:
      - go test -tags authelia ./internal/auth

  # Development servers
  run:web:
    desc: Start the player Vite development server (localhost:14559)
    cmds:
      - pnpm dev {{.CLI_ARGS}}

  run:admin:
    desc: Start the admin Vite development server (localhost:14561/admin/)
    cmds:
      - pnpm dev:admin {{.CLI_ARGS}}

  run:server:
    desc: Run the Go service in development mode (127.0.0.1:14560, admin / admin) with the NetEase API container
    dir: backend
    cmds:
      # The container goes away with the server; its keys stay in .data. The
      # mode lets the container's user write there under rootless Docker too,
      # where it maps to neither the owner nor the group.
      - mkdir -p .data/netease-api && chmod 777 .data/netease-api
      - docker rm -f {{.NETEASE_API_CONTAINER}} > /dev/null 2>&1 || true
      - >-
        docker run -d --rm --name {{.NETEASE_API_CONTAINER}}
        -p 127.0.0.1:14562:3000
        -v "$PWD/.data/netease-api:/tmp"
        {{.NETEASE_API_IMAGE}} > /dev/null
      - defer: docker rm -f {{.NETEASE_API_CONTAINER}} > /dev/null 2>&1 || true
      - go run -tags dev ./cmd/sonora -config config.dev.yaml {{.CLI_ARGS}}
